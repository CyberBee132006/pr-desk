<style>
:root{
  --ivory:#F4F1EA; --ivory2:#ECE7DC; --paper:#FBF9F4; --white:#FFFEFB; --line:#E5E0D4; --line2:#EFEBE2;
  --indigo:#1E1B4B; --indigo2:#3A3577; --lime:#C6F432; --gold:#B8933B; --muted:#6E6A7C;
  --red:#B4232F; --redbg:#F8E3E1; --green:#2F6B2A; --greenbg:#E3EFD8; --amber:#8A5A0B; --amberbg:#F6EAD2;
  --blue:#2A4BA8; --bluebg:#E6EBF8; --x:#1E1B4B; --li:#2A4BA8;
  --sans:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --side:252px; --bar:56px;
  --royal:#1E1B4B; --on-royal:#F4F1EA; --btn:#1E1B4B; --on-btn:#F4F1EA; --field:#2A2660; --field-line:#3D3880; --panel-muted:#C9C6E0; --todaybg:#FDFCF3; color-scheme:light;
}
/* dark mode: automatic with the system, or forced from the top bar */
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){
  --ivory:#000000; --ivory2:#1A1A1A; --paper:#0A0A0A; --white:#111111; --line:#2A2A2A; --line2:#1F1F1F;
  --indigo:#F2F2F2; --indigo2:#BDBDBD; --muted:#8F8F8F; --gold:#D4AE55;
  --red:#FF8A8A; --redbg:#2A1414; --green:#97DB86; --greenbg:#142414; --amber:#F2B95C; --amberbg:#2A2010;
  --blue:#9FB8FF; --bluebg:#141C2E; --x:#262626; --li:#2F5BD3; --royal:#161616; --on-royal:#F4F1EA; --btn:#C6F432; --on-btn:#000000; --field:#0A0A0A; --field-line:#2E2E2E; --panel-muted:#A3A3A3; --todaybg:#0F0F0F; --lime:#C6F432; color-scheme:dark;
}}
:root[data-theme=dark]{
  --ivory:#000000; --ivory2:#1A1A1A; --paper:#0A0A0A; --white:#111111; --line:#2A2A2A; --line2:#1F1F1F;
  --indigo:#F2F2F2; --indigo2:#BDBDBD; --muted:#8F8F8F; --gold:#D4AE55;
  --red:#FF8A8A; --redbg:#2A1414; --green:#97DB86; --greenbg:#142414; --amber:#F2B95C; --amberbg:#2A2010;
  --blue:#9FB8FF; --bluebg:#141C2E; --x:#262626; --li:#2F5BD3; --royal:#161616; --on-royal:#F4F1EA; --btn:#C6F432; --on-btn:#000000; --field:#0A0A0A; --field-line:#2E2E2E; --panel-muted:#A3A3A3; --todaybg:#0F0F0F; --lime:#C6F432; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--indigo);font:14px/1.5 var(--sans);height:100%}
button{font:500 13px var(--sans);color:var(--indigo);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--indigo2)}
button.primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
button.primary:hover{background:var(--indigo2)}
button.done{background:var(--lime);color:#000;border-color:#a9d61a}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--ivory2);border-color:transparent}
button.small{padding:3px 8px;font-size:12px}
button.tiny{padding:2px 7px;font-size:12px}
input,textarea{width:100%;font:14px var(--sans);color:var(--indigo);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--lime);border-color:var(--indigo2)}
code{font-family:var(--mono);font-size:12.5px;background:var(--ivory2);padding:1px 5px;border-radius:4px}
a{color:inherit}
.muted{color:var(--muted)} .small{font-size:12px}
.tag{background:var(--lime);color:#111;font:600 12px var(--mono);padding:2px 8px;border-radius:4px}
.boot{display:flex;align-items:center;justify-content:center;height:100vh;gap:6px;font-weight:700;font-size:18px}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--bar) minmax(0,1fr);height:100vh;overflow:hidden}
.side{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:7px;flex:none;width:calc(var(--side) - 20px)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.3px}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{grid-column:1/-1;height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:5}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;height:100%;align-items:stretch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;border-radius:0;padding:0 14px;color:var(--muted);font-weight:500;white-space:nowrap;position:relative;transition:color .15s}
.tab:hover{color:var(--indigo);background:transparent}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--lime);transform:scaleX(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tab.on{color:var(--indigo);font-weight:600}
.tab.on::after{transform:scaleX(1)}
.calbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--ivory);flex:none}
.bar-l{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.calbar h1{margin:0 0 0 8px;font-size:19px;font-weight:650;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--ivory2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:5px 12px;border-radius:7px;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--indigo);box-shadow:0 1px 2px rgba(30,27,75,.12)}
.sync{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dot.live{background:#7cbb12}
.dot.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.sync-l{min-width:52px}
main{flex:1;overflow:auto;padding:22px 28px 60px;min-height:0}
main>*{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.wide{padding:0;overflow:hidden;display:flex;flex-direction:column}

/* mini calendar */
.mini{padding:0 4px}
.mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:13px}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-wd{font:600 10.5px var(--mono);color:var(--muted);text-align:center;padding:3px 0}
.mini-d{border:none;background:transparent;padding:0;height:27px;border-radius:7px;font:12px var(--sans);position:relative}
.mini-d:hover{background:var(--ivory2)}
.mini-d.out{color:#b3aebb}
.mini-d.has::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.mini-d.today{background:var(--lime);color:#111;font-weight:700}
.mini-d.sel:not(.today){background:transparent;box-shadow:inset 0 0 0 2px var(--lime);color:inherit}
.mini-d.sel::after{background:var(--lime)}

/* sidebar extras */
.eng-mini{display:grid;gap:6px;text-align:left;background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px}
.eng-mini .nav-h{padding:0}
.eng-bar{height:6px;background:var(--ivory2);border-radius:6px;overflow:hidden}
.eng-fill{display:block;height:100%;background:var(--lime);transition:width .4s}
/* nav */
.nav{display:grid;gap:1px}
.nav-h{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 8px 4px}
.nav-i{display:flex;align-items:center;gap:9px;border:none;background:transparent;text-align:left;padding:7px 8px;border-radius:7px;color:var(--indigo)}
.nav-i:hover{background:var(--ivory2)}
.nav-i.on{background:var(--ivory2);font-weight:600;box-shadow:inset 3px 0 0 var(--lime)}
.ico{width:18px;text-align:center;color:var(--muted)}
.upc{display:grid;gap:4px}
.upc-i{display:grid;gap:1px;text-align:left;border:none;border-left:3px solid var(--x);border-radius:0 7px 7px 0;background:var(--ivory);padding:6px 8px}
.upc-i.li{border-left-color:var(--li)}
.upc-i:hover{background:var(--ivory2)}
.upc-t{font:600 11px var(--mono)}
.upc-x{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* time grid */
.tgrid{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--white)}
.thead{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);flex:none}
.gutter-h{display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.tz{font:10px var(--mono);color:var(--muted)}
.dh{border:none;border-left:1px solid var(--line2);border-radius:0;background:transparent;display:flex;align-items:center;gap:8px;padding:10px 10px 8px;flex-wrap:wrap}
.dh:hover{background:var(--paper)}
.dh-w{font:12px var(--sans);color:var(--muted)}
.dh-n{font-size:20px;font-weight:600;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.dh.today .dh-n{background:var(--lime);color:#111}
.dh.today .dh-w{color:var(--indigo);font-weight:600}
.dh-c{font:10.5px var(--mono);color:var(--gold);width:100%}
.tbody{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));overflow-y:auto;flex:1;min-height:0}
.tgrid.one .tbody{grid-template-columns:56px minmax(0,1fr)}
.gutter .hr{font:10.5px var(--mono);color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px)}
.tcol{position:relative;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line2) 55px,var(--line2) 56px)}
.tcol.today{background-color:var(--todaybg)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.ev{position:absolute;min-height:50px;border-radius:7px;padding:5px 7px;background:var(--bluebg);border-left:3px solid var(--x);cursor:pointer;overflow:hidden;z-index:2;box-shadow:0 1px 0 rgba(30,27,75,.04)}
.ev.li{border-left-color:var(--li)}
.ev{transition:box-shadow .15s,transform .15s;animation:pop .25s ease-out}
.ev:hover{box-shadow:0 4px 14px rgba(30,27,75,.14);z-index:4;transform:translateY(-1px)}
.ev:active{cursor:grabbing}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ev.draft{background:var(--amberbg)}
.ev.approved{background:#EEF9C8}
.ev.posted{background:var(--greenbg);opacity:.75}
.ev.skipped{background:var(--ivory2);opacity:.55;text-decoration:line-through}
.ev-h{display:flex;align-items:center;gap:4px;min-width:0}
.ev-t{white-space:nowrap}
.ev-t{font:600 11px var(--mono)}
.ev-p{font:600 10px var(--mono);background:var(--x);color:var(--on-royal);border-radius:4px;padding:0 5px}
.ev.li .ev-p{background:var(--li)}
.ev-x{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* day view */
.dayview{display:grid;grid-template-columns:minmax(320px,1fr) minmax(380px,1.15fr);flex:1;min-height:0}
.dayview .tgrid{border-right:1px solid var(--line)}
.daycards{overflow-y:auto;padding:18px 22px 60px}

/* month */
.month{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 16px 12px;background:var(--white)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;flex:1;min-height:0;grid-auto-rows:1fr}
.mwd{flex:none;grid-auto-rows:auto;border-bottom:1px solid var(--line)}
.wdn{font:600 11.5px var(--mono);color:var(--muted);padding:10px 8px}
.cell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:96px}
.cell:nth-child(7n){border-right:none}
.cell.out{background:var(--paper)}
.cell.out .num{color:#b3aebb}
.cell.sel{background:#FBFAF1}
.num{font:600 12px var(--sans);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.cell.today .num{background:var(--lime);color:#111}
.chip{font:11px var(--sans);padding:2px 6px;border-radius:5px;background:var(--bluebg);color:var(--indigo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--x)}
.chip.li{border-left-color:var(--li)}
.chip b{font:600 10.5px var(--mono)}
.chip.draft{background:var(--amberbg)} .chip.approved{background:#EEF9C8} .chip.posted{background:var(--greenbg)}
.chip.skipped{background:var(--ivory2);color:var(--muted);text-decoration:line-through}
.chip.locked{background:var(--bluebg)}
.more{font:11px var(--mono);color:var(--muted)}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:10px;flex:none}
.legend .chip{border-left:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--ivory);border-left:1px solid var(--line);z-index:31;overflow-y:auto;padding:14px 18px 40px;box-shadow:-12px 0 40px rgba(30,27,75,.15);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:13px var(--mono)}

/* agenda + posts */
.nextup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--royal);color:var(--on-royal);padding:12px 16px;border-radius:12px;margin-bottom:18px}
.nextup .muted{color:#BDB9D6}
.day{margin-bottom:28px;max-width:860px}
.day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.day-head h2{margin:0;font-size:20px;letter-spacing:-.3px}
.theme{font:12px var(--mono);color:var(--gold)}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:18px}
.pill{font:600 11px var(--mono);padding:2px 8px;border-radius:999px}
.pill.draft{background:var(--amberbg);color:var(--amber)} .pill.locked{background:var(--bluebg);color:var(--blue)}
.pill.approved{background:var(--lime);color:#111} .pill.posted{background:var(--greenbg);color:var(--green)}
.pill.skipped{background:var(--ivory2);color:var(--muted)}
.post{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--x);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.post.li{border-left-color:var(--li)}
.post.posted,.post.skipped{opacity:.75}
.post-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.post-head .pill{margin-left:auto}
.time{font:600 14px var(--mono)}
.plat{font:600 11px var(--mono);padding:2px 7px;border-radius:5px;color:var(--on-royal);background:var(--x)}
.plat.li{background:var(--li)}
.kind{font:12px var(--mono);color:var(--gold)}
.moved{font:11px var(--mono);color:var(--amber);background:var(--amberbg);padding:1px 6px;border-radius:4px}
.text{white-space:pre-wrap;margin:0 0 6px;font-size:14.5px}
.thread{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:start;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.thread .n{font:12px var(--mono);color:var(--gold);padding-top:2px}
.first-comment{display:grid;grid-template-columns:1fr auto;gap:4px 8px;background:var(--ivory);border-radius:8px;padding:8px 10px;margin-top:8px}
.first-comment .lbl{grid-column:1/-1;font:11px var(--mono);color:var(--gold)}
.why{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.hashtag{font:600 12.5px var(--sans);color:var(--blue);background:var(--bluebg);padding:1px 8px;border-radius:999px}
.post{transition:box-shadow .15s}
.post:hover{box-shadow:0 6px 18px rgba(30,27,75,.07)}
/* engage */
.engage{max-width:960px}
.playbook{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;border:1px solid var(--line);background:var(--royal);color:var(--on-royal);border-radius:16px;padding:20px 22px;margin-bottom:22px}
.playbook h2{margin:8px 0 6px;font-size:20px}
.playbook .muted{color:var(--panel-muted)}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;align-content:center}
.rules b{color:var(--lime)}
.eng-day{margin-bottom:24px}
.task{display:grid;grid-template-columns:20px 78px 104px 1fr;gap:10px;align-items:start;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:background .15s,opacity .2s}
.task:hover{background:var(--paper)}
.task input{width:16px;height:16px;margin:2px 0 0;accent-color:#7cbb12}
.task-t{font:600 12.5px var(--mono)}
.task-k{font:600 11px var(--mono);text-transform:uppercase;color:var(--gold);padding-top:2px}
.task.golden-hour .task-k{color:var(--red)}
.task.done{opacity:.55}
.task.done .task-x{text-decoration:line-through}
/* outreach */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{border-radius:999px;padding:5px 12px}
.chipbtn.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stage{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid}
.stage b{font-size:22px}
.stage span{font:11px var(--mono);color:var(--muted);text-transform:uppercase}
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.opp{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;transition:transform .15s,box-shadow .15s}
.opp:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,27,75,.08)}
.opp h3{margin:2px 0 0;font-size:16px}
.opp p{margin:0;font-size:13px}
.opp-h{display:flex;justify-content:space-between}
.okind{font:600 11px var(--mono);text-transform:uppercase;color:var(--gold)}
.pitch{background:var(--ivory);border-radius:8px;padding:8px 10px}
.linkbtn2{font:600 12.5px var(--sans);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.linkbtn2:hover{border-color:var(--indigo2)}
.pill.idea{background:var(--ivory2);color:var(--muted)} .pill.drafted{background:var(--amberbg);color:var(--amber)}
.pill.sent{background:var(--bluebg);color:var(--blue)} .pill.replied,.pill.won{background:var(--greenbg);color:var(--green)}
.pill.passed{background:var(--ivory2);color:var(--muted)}
/* pillars */
.pillars{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pillar{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.pillar-h{display:flex;justify-content:space-between}
.pct{font:600 13px var(--mono);color:var(--gold)}
.pbar{height:6px;background:var(--ivory2);border-radius:6px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--royal);border-radius:6px}
.cardimg{margin:10px 0;max-width:520px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cardimg svg{display:block;width:100%;height:auto}
.issues{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.issue{font:12px var(--mono);padding:2px 8px;border-radius:5px}
.issue.block{background:var(--redbg);color:var(--red)} .issue.warn{background:var(--amberbg);color:var(--amber)}
.chars{font:11px var(--mono);color:var(--muted);margin-left:auto}
.chars.over{color:var(--red);font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.form{display:grid;gap:6px;background:var(--ivory);border-radius:10px;padding:12px;margin-top:10px}
.form label{font:600 12px var(--mono);color:var(--muted);margin-top:4px}
.row-hint{font:11px var(--mono);color:var(--muted);text-align:right}
.quick{display:flex;gap:6px}

/* threads */
.threadtag,.ideatag{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--royal);color:var(--lime)}
.ideatag{background:var(--lime);color:#111}
.post-body.is-thread{position:relative}
.post-body.is-thread .thread{border-top:0;position:relative;padding:6px 0 8px;margin:0}
.post-body.is-thread .thread::before{content:"";position:absolute;left:13px;top:28px;bottom:-6px;width:2px;background:var(--ivory2);border-radius:2px}
.post-body.is-thread .thread:last-of-type::before{display:none}
.post-body.is-thread .thread .n{display:grid;place-items:center;width:28px;height:24px;border-radius:999px;background:var(--ivory);font-weight:700;padding:0;position:relative;z-index:1}
.post-body.is-thread .thread.first .n{background:var(--lime);color:#111}
/* ideas */
.ideas{max-width:900px}
.composer{border:1px solid var(--line);background:var(--royal);color:var(--on-royal);border-radius:16px;padding:18px 20px;margin-bottom:18px;display:grid;gap:10px;animation:rise .35s ease both}
.composer h2{margin:0;font-size:20px}
.composer .muted{color:var(--panel-muted);margin:0;font-size:13.5px}
.composer textarea,.composer .note{background:var(--field);color:var(--on-royal);border:1px solid var(--field-line);border-radius:10px;padding:10px 12px;font:14.5px var(--sans);width:100%;box-sizing:border-box;resize:vertical}
.composer textarea::placeholder,.composer .note::placeholder{color:var(--panel-muted)}
.composer textarea:focus,.composer .note:focus{outline:2px solid var(--lime);outline-offset:1px}
.composer .chipbtn{background:transparent;color:var(--on-royal);border-color:var(--field-line)}
.composer .chipbtn.on{background:var(--lime);color:#000;border-color:var(--lime)}
.composer .primary{background:var(--lime);color:#000;border-color:var(--lime)}
.composer .actions{align-items:center;margin-top:0}
.fmt-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fmt-row .days{display:flex;align-items:center;gap:6px;font:12.5px var(--mono)}
.fmt-row .days input{width:64px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);font:13px var(--mono)}
.cnt{font:600 11px var(--mono);margin-left:6px;opacity:.7}
.idea-list{display:grid;gap:10px}
.idea{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;animation:rise .3s ease both}
.idea.scheduled{border-left-color:var(--blue)} .idea.done{border-left-color:var(--green);opacity:.85} .idea.dropped{border-left-color:var(--ivory2);opacity:.7}
.idea-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.idea-h .fmt{font:12px var(--mono);color:var(--gold)}
.idea-text{white-space:pre-wrap;margin:0 0 6px;font-size:15px}
.pill.new{background:var(--amberbg);color:var(--amber)} .pill.scheduled{background:var(--bluebg);color:var(--blue)}
.pill.done{background:var(--greenbg);color:var(--green)} .pill.dropped{background:var(--ivory2);color:var(--muted)}
.progress{height:6px;background:var(--ivory2);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.progress span{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .4s}
.slots{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.slots li{display:grid;grid-template-columns:150px 70px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--paper);cursor:pointer;font-size:13px;transition:background .15s}
.slots li:hover{background:var(--ivory2)}
.slots .when{font:12px var(--mono)} .slots .plat{justify-self:start}
.slots .mark{font:11px var(--mono);color:var(--muted)} .slots li.ok .mark{color:var(--green)}
.danger{color:var(--red)!important;border-color:var(--red)!important}
@media (max-width:640px){ .slots li{grid-template-columns:1fr auto} .slots .t{grid-column:1/-1} .slots .mark{display:none} }

/* sources + media */
.sources{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:12.5px}
.sources .lbl{font:11px var(--mono);color:var(--gold)}
.sources a{color:var(--blue);text-decoration:none;border-bottom:1px dashed var(--bluebg)}
.sources a:hover{border-bottom-color:var(--blue)}
.media{display:grid;gap:10px;margin:10px 0}
.mitem{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--ivory);max-width:640px;animation:rise .35s ease both}
.mitem figcaption{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:12.5px}
.mitem figcaption .mk{font:600 11px var(--mono);color:var(--gold)}
.mitem figcaption button{margin-left:auto}
.mitem img,.mitem video{display:block;width:100%;height:auto;background:#111}
.mitem .slides{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 10px 10px}
.mitem .slides img{width:220px;flex:0 0 auto;border-radius:8px;scroll-snap-align:start}
.mitem .slides .slide{display:flex;flex-direction:column;gap:4px;align-items:flex-start;flex:0 0 auto}
.mload{height:180px;background:linear-gradient(90deg,var(--ivory2),var(--paper),var(--ivory2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- posting, hooks, results, redo, preview ---------- */
button.postnow{background:var(--lime);color:#1E1B4B;border-color:#a9d61a;font-weight:700}
button.postnow:hover{filter:brightness(.96);border-color:#93bd12}
.actions button.ghost.on{background:var(--ivory2)}
.hooks{display:grid;gap:6px;margin:10px 0}
.hooks .lbl,.redo-note .lbl{font:11px var(--mono);color:var(--gold)}
.hook{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:8px 10px;border-radius:10px;background:var(--paper);white-space:normal;line-height:1.4}
.hook.on{border-color:var(--royal);background:var(--white);box-shadow:0 0 0 2px var(--lime) inset}
.hk-n{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--ivory2);font:700 11px var(--mono)}
.hook.on .hk-n{background:var(--lime);color:#1E1B4B}
.redo-note{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--amberbg);color:var(--amber);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px}
.result-row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:8px 0;font:12.5px var(--mono);color:var(--muted)}
.result-row b{color:var(--green)}
.result-row a{color:var(--blue)}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:10px 0 4px}
.numf{display:grid;gap:4px}.numf span{font:11px var(--mono);color:var(--muted)}
.numf input{padding:8px 10px;width:100%;box-sizing:border-box}
.feed{max-width:560px;margin:10px 0;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .3s ease both}
.fp-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.fp-av{width:40px;height:40px;border-radius:999px;background:var(--royal);color:var(--lime);display:grid;place-items:center;font:700 14px var(--mono);flex:none}
.fl .fp-av{border-radius:999px}
.fp-id{display:grid;line-height:1.25;min-width:0}.fp-id b{font-size:14.5px}
.fp-dots{margin-left:auto;color:var(--muted)}
.fp-text{white-space:pre-wrap;margin:4px 0 8px;font-size:15px;line-height:1.45}
.fl .fp-text{font-size:14px}
.fp-more{color:var(--muted);font-weight:600;margin-left:4px}
.fp-fold{font:11.5px var(--mono);color:var(--amber);background:var(--amberbg);border-radius:6px;padding:4px 8px;margin:0 0 8px}
.fp-media{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.fl .fp-media{border-radius:4px;margin:0 -14px}
.fp-media img{width:100%;height:100%;object-fit:cover;display:block}
.fp-pages{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font:600 11px var(--mono);padding:3px 8px;border-radius:999px}
.fp-thread{color:var(--blue);font-size:13.5px;margin:8px 0 0}
.fp-actions{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line2)}
.fx .fp-actions{border-top:0;max-width:420px}
.fp-note{font-size:12px;margin:8px 0 0;padding:5px 8px;border-radius:6px}
.fp-note.ok{background:var(--greenbg);color:var(--green)}.fp-note.warn{background:var(--amberbg);color:var(--amber)}
.pill.reschedule{background:var(--redbg);color:var(--red)}
.post.reschedule{border-left-color:var(--red);opacity:.9}
.ev.reschedule,.chip.reschedule{opacity:.55;text-decoration:line-through}
/* State markers: readable without relying on colour alone */
.ev-s{display:inline-block;margin:0 auto 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font:700 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--white);color:var(--indigo);border:1px solid var(--line)}
.cs{font:700 10px var(--mono);margin-right:4px}
.legend .cs{margin:0;text-transform:uppercase;letter-spacing:.03em}
.st-draft{color:var(--amber)!important}
.st-locked{color:var(--muted)!important}
.st-approved{background:var(--lime)!important;color:#111!important;border-color:transparent!important}
.legend .st-approved{padding:0 4px;border-radius:3px}
.st-scheduled{background:var(--x)!important;color:var(--on-royal)!important;border-color:transparent!important}
.legend .st-scheduled{padding:0 4px;border-radius:3px}
.st-posted{color:var(--green)!important}
.st-skipped,.st-reschedule{color:var(--muted)!important}
.st-missed{background:var(--red)!important;color:#fff!important;border-color:transparent!important}
.legend .st-missed{padding:0 4px;border-radius:3px}
.ev.scheduled,.chip.scheduled{background:var(--bluebg);outline:1.5px dashed var(--x);outline-offset:-2px}
.ev.locked,.chip.locked{background:var(--ivory)}
.ev.missed,.chip.missed{background:var(--redbg);box-shadow:inset 0 0 0 1.5px var(--red)}
.ev.posted .ev-x,.chip.posted{text-decoration:none}

/* ---------- top bar extras ---------- */
.tab .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font:700 10.5px var(--mono);vertical-align:1px}
.themebtn{font-size:14px;width:28px}
.busybtn{white-space:nowrap}

/* ---------- busy blocks ---------- */
.busy{display:grid;gap:8px;align-content:start}
.busy h3{margin:0;font-size:15px}
.busy-row{display:flex;gap:8px;align-items:center}
.busy-row input[type=date],.busy-row input[type=time]{flex:1;min-width:0}
.tog{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:13px}
.tog input{width:auto}
.busy-list{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.busy-list li{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 4px 4px 10px;font-size:13px}
.busy-d{font:600 12px var(--mono)}
.busyband{position:absolute;left:0;right:0;z-index:0;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(180,35,47,.10) 0 8px,rgba(180,35,47,.04) 8px 16px);border:1px dashed rgba(180,35,47,.35);pointer-events:none}
.busyband span{position:absolute;left:6px;top:3px;font:600 10.5px var(--mono);color:var(--red)}
.cell.busyday{background:repeating-linear-gradient(135deg,rgba(180,35,47,.07) 0 8px,transparent 8px 16px)}
.busytag{margin-left:6px;font:600 10px var(--mono);color:var(--red);background:var(--redbg);padding:1px 6px;border-radius:999px}

/* ---------- reschedule ---------- */
.resched{max-width:960px}
.small-pb{grid-template-columns:1.2fr 1fr;align-items:start}
.small-pb h2{margin:8px 0 6px}
.small-pb .busy input{background:#2A2660;color:var(--on-royal);border-color:#3D3880}
.small-pb .busy button.primary{background:var(--lime);color:#1E1B4B;border-color:var(--lime)}
.resched-item{margin-bottom:6px;animation:rise .3s ease both}

/* ---------- growth ---------- */
.growth{max-width:1100px}
.seg.wide{display:inline-flex;margin-bottom:16px}
.seg.wide button{padding:6px 14px}
.hint{background:var(--bluebg);color:var(--blue);border-radius:10px;padding:10px 12px;font-size:13.5px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:12px 0}
.gcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .3s ease both}
.gcard h3{margin:0 0 8px;font-size:14px}
.gcard ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.gcard.win{border-top:3px solid #7cbb12}.gcard.fix{border-top:3px solid var(--red)}
.gcard .bar-row{grid-template-columns:120px 1fr 72px}
.toprow{display:grid;grid-template-columns:56px 1fr;gap:8px;text-align:left;width:100%;margin-bottom:6px;white-space:normal}
.toprow b{color:var(--green);font-family:var(--mono)}
.rep-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rep-h h2{margin:0;font-size:20px}
.rep-h select{margin-left:auto;width:auto;font:13px var(--sans);padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--indigo)}
.rep-sum{font-size:15px;line-height:1.55;max-width:820px}
.pb-role{font-size:15px;max-width:820px}
.pb-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.pb-facts div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.pb-facts span{font:11px var(--mono);color:var(--gold);text-transform:uppercase}
.pb-facts b{font-size:13.5px;font-weight:600}
.checks{display:grid;gap:6px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.check input{width:16px;height:16px;margin-top:2px;accent-color:#7cbb12;flex:none}
.check span{display:grid;gap:2px}
.check.done b{text-decoration:line-through;opacity:.6}

/* ---------- library ---------- */
.library{max-width:1100px}
.lib-search input{font-size:15px;padding:10px 14px;border-radius:12px;margin-bottom:10px}
.filters .sep{width:1px;background:var(--line);margin:2px 4px}
.lib-list{display:grid;gap:4px}
.lib-row{display:grid;grid-template-columns:150px 90px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border-left:3px solid var(--x);border-radius:8px;white-space:normal}
.lib-row.li{border-left-color:var(--li)}
.lib-when{font:12px var(--mono);color:var(--muted)}
.lib-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-meta{display:flex;gap:10px;font:12px var(--mono);color:var(--muted)}
.lib-meta b{color:var(--green)}

/* ---------- taste memory ---------- */
.taste{display:grid;gap:10px}
.taste-sum{background:var(--royal);color:var(--on-royal);border-radius:14px;padding:14px 16px;margin:0;font-size:14.5px;line-height:1.55}
.taste-add{display:flex;gap:8px}
.taste-add select{width:auto;font:13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--indigo)}
.taste-add input{flex:1;min-width:0}
.taste-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tnotes{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.tnotes li{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:start;font-size:13px}
.tsrc{font:10.5px var(--mono);color:var(--muted);padding-top:2px}
.taste-likes{border-top:3px solid #7cbb12}.taste-dislikes{border-top:3px solid var(--red)}.taste-visual{border-top:3px solid var(--gold)}.taste-voice{border-top:3px solid var(--blue)}

/* ---------- ideas attachments, settings steps ---------- */
.attach{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:600 13px var(--sans);color:var(--on-royal);border:1px dashed #4A4590;border-radius:999px;padding:5px 12px}
.filebtn input{display:none}
.thumb{position:relative;display:inline-block}
.thumb img{height:54px;border-radius:8px;display:block}
.thumb button{position:absolute;right:-8px;top:-8px;background:var(--royal);color:var(--on-royal);border-radius:999px;padding:0 6px}
.steps{display:grid;gap:10px;padding-left:20px;max-width:760px}
.steps li{line-height:1.5}
@media (max-width:860px){
  .nums{grid-template-columns:repeat(3,minmax(0,1fr))}
  .small-pb{grid-template-columns:1fr}
  .pb-facts{grid-template-columns:1fr}
  .lib-row{grid-template-columns:1fr auto;gap:4px 8px}
  .lib-row .lib-text{grid-column:1/-1;white-space:normal}
  .lib-row .lib-meta{grid-column:1/-1}
  .taste-add{flex-wrap:wrap}.taste-add input{flex-basis:100%}
  .busybtn{display:none}
  .gcard .bar-row{grid-template-columns:90px 1fr 64px}
}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:var(--ivory2);border-radius:12px;padding:8px;min-height:60vh}
.bhead{display:flex;justify-content:space-between;font:600 13px var(--mono);padding:4px 6px 8px}
.count{color:var(--muted)}
.bcard{background:var(--white);border-radius:8px;padding:8px 9px;margin-bottom:6px;border-left:3px solid var(--blue);cursor:pointer}
.bcard:hover{outline:1px solid var(--indigo2)}
.wmeta{display:flex;justify-content:space-between;gap:4px;align-items:center;font-size:12px}
.wtext{font-size:12.5px;margin:3px 0;line-height:1.4}

/* stats */
.gcard.findings{margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.metric{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px}
.metric span{display:block;font-size:12px;color:var(--muted)}
.metric b{font-size:26px;letter-spacing:-.5px}
.bars{display:grid;gap:7px;max-width:720px}
.bar-row{display:grid;grid-template-columns:120px 1fr 36px;gap:8px;align-items:center;font:13px var(--mono)}
.bar-row .bar{all:unset;display:block;background:var(--ivory2);border-radius:5px;height:12px}
.fill{background:var(--royal);height:12px;border-radius:5px}

/* profile */
.prof{max-width:1080px}
.prof-hero{display:flex;gap:20px;align-items:center;background:var(--royal);color:var(--on-royal);border-radius:18px;padding:26px 28px;margin-bottom:16px}

<script>
// Stale-page guard: GitHub Pages lets browsers cache index.html for 10 minutes.
// CI stamps <meta name="build"> and version.txt with the same id.
(function () {
  const mine = document.querySelector('meta[name="build"]').content;
  if (mine === "dev") return;
  async function latest() {
    try { const r = await fetch("version.txt?_=" + Date.now(), { cache: "no-store" }); return r.ok ? (await r.text()).trim() : ""; }
    catch (e) { return ""; }
  }
  function banner() {
    if (document.querySelector(".newver")) return;
    const d = document.createElement("div");
    d.className = "newver";
    d.innerHTML = "New version of PR desk is ready <button>Reload</button>";
    d.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(d);
  }
  async function check(first) {
    const v = await latest();
    if (!v || v === mine) return;
    let tried = ""; try { tried = sessionStorage.getItem("pr_reloaded") || ""; } catch (e) {}
    if (first && tried !== v) { try { sessionStorage.setItem("pr_reloaded", v); } catch (e) {} location.reload(); return; }
    banner();
  }
  check(true);
  setInterval(() => check(false), 5 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(false); });
})();
</script>
